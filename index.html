<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Game Boy Mario Land - Edición Modular</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="gameboy">
        <div class="screen-bezel">
            <div class="bezel-header">
                <div class="battery-led"></div>
                <div class="bezel-title">DOT MATRIX WITH STEREO SOUND</div>
            </div>
            <div class="screen-container">
                <canvas id="gameCanvas" width="570" height="360"></canvas>
            </div>
        </div>
        
        <div class="brand">Game Boy <span>COLOR</span></div>

        <div class="controls">
            <!-- Cruceta direccional con zonas de toque individuales -->
            <div class="dpad">
                <div class="dpad-v"></div>
                <div class="dpad-h"></div>
                <div class="dpad-center-mark"></div>
                
                <div id="btn-up" class="dpad-btn dpad-up"></div>
                <div id="btn-down" class="dpad-btn dpad-down"></div>
                <div id="btn-left" class="dpad-btn dpad-left"></div>
                <div id="btn-right" class="dpad-btn dpad-right"></div>
            </div>

            <!-- Botones B y A -->
            <div class="buttons-ab">
                <div class="btn-wrapper">
                    <div id="btn-b" class="btn-round"></div>
                    <div class="btn-label-ab">B</div>
                </div>
                <div class="btn-wrapper">
                    <div id="btn-a" class="btn-round"></div>
                    <div class="btn-label-ab">A</div>
                </div>
            </div>
        </div>

        <!-- Botones Select y Start -->
        <div class="system-buttons">
            <div class="system-btn-group">
                <div id="btn-select" class="btn-pill"></div>
                <div class="system-label">SELECCION</div>
            </div>
            <div class="system-btn-group">
                <div id="btn-start" class="btn-pill"></div>
                <div class="system-label">INICIO</div>
            </div>
        </div>
    </div>

    <div class="instructions">
        Moverse: <b>A / D o Flechas</b> | Saltar: <b>Espacio / W</b> | Entrar Tubería: <b>S / Flecha Abajo</b>
    </div>

    <script type="module" src="js/main.js?v=1.0.2"></script>
</body>
</html>
